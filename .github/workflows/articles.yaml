# Builds changed articles independently of the pkgdown reference build.
# Workflow changes and manual dispatch rebuild every article. Pull requests
# validate articles with read-only permissions and never deploy.
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'vignettes/**'
      - '.github/workflows/articles.yaml'
  workflow_dispatch:

name: articles

permissions:
  contents: read

# Keep trusted builds and publication in the existing Pages queue. PR
# validation has its own group and cannot delay or cancel publication.
concurrency:
  group: scop-pages-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
  queue: max

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      articles: ${{ steps.changed.outputs.articles }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed articles
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Compare the same merge tree that checkout builds, not an
            # outdated branch head that lacks newer base-branch changes.
            head="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "articles=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head~1"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "articles=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Dependency and build changes must be exercised even when no
          # vignette source changed (for example, a dependency-only repair).
          if ! git diff --quiet "$base" "$head" -- .github/workflows/articles.yaml; then
            echo "articles=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          articles="$(git diff --no-renames --diff-filter=AM --name-only "$base" "$head" -- vignettes/ |
            sed -n 's|^vignettes/\(.*\)[.]Rmd$|\1|p' |
            sort -u |
            paste -sd, -)"
          echo "articles=${articles:-none}" >> "$GITHUB_OUTPUT"

  articles:
    needs: changes
    if: needs.changes.outputs.articles != 'none'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          # pryr is archived on CRAN and only used by Monocle3's own tests.
          # pak's ignore modifier excludes optional dependencies only.
          extra-packages: |
            any::pkgdown
            local::.
            github::immunogenomics/harmony
            github::cole-trapnell-lab/monocle3
            github::satijalab/seurat-data
            # Optional SeuratData mapping support is not used by these articles.
            Azimuth=?ignore
            pryr=?ignore
            bioc::org.Mm.eg.db
            bioc::GO.db
            any::shadowtext
          needs: website

      - name: Verify Harmony source
        shell: Rscript {0}
        run: |
          harmony_source <- utils::packageDescription("harmony")
          stopifnot(
            identical(harmony_source$RemoteUsername, "immunogenomics"),
            identical(harmony_source$RemoteRepo, "harmony")
          )

      - name: Build changed articles
        shell: Rscript {0}
        env:
          CHANGED_ARTICLES: ${{ needs.changes.outputs.articles }}
        run: |
          articles <- Sys.getenv("CHANGED_ARTICLES")
          if (!nzchar(articles) || identical(articles, "none")) {
            message("No articles changed; skipping build.")
            quit(status = 0L)
          }
          if (identical(articles, "all")) {
            paths <- list.files(
              "vignettes",
              pattern = "[.]Rmd$",
              recursive = TRUE,
              full.names = TRUE
            )
            names <- tools::file_path_sans_ext(sub("^vignettes/", "", paths))
          } else {
            names <- strsplit(articles, ",", fixed = TRUE)[[1]]
          }
          pkgdown::build_articles_index()
          for (name in names) {
            message("Building article: ", name)
            pkgdown::build_article(name)
          }

      - name: Upload built articles
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: docs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: articles
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: docs

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
