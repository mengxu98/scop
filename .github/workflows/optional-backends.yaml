name: optional-backends

on:
  schedule:
    # 02:00 Wednesday Asia/Shanghai, expressed in UTC.
    - cron: '0 18 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: monocle2
            filter: monocle2
            packages: |-
              mengxu98/monocle
              DDRTree@0.1.6
            required: |-
              monocle
              DDRTree
          - suite: giotto
            filter: framework-bridges|param-list-utils|pr306-spatial-baseline
            packages: |-
              giotto-suite/Giotto
              cran::geometry
            required: |-
              Giotto
              geometry
          - suite: tage
            filter: runtage-preprocessing|tage-cpp
            packages: Gladyshev-Lab/tAge
            required: tAge
          - suite: cibersort
            filter: cibersort-cpp
            packages: |-
              bioc::preprocessCore
              Moonerss/CIBERSORT
            required: CIBERSORT
          - suite: grn-rna
            filter: grn-rna-backends
            packages: |-
              cran::pbapply
              cran::ppcor
              cran::purrr
            required: |-
              pbapply
              ppcor
              purrr

    name: optional (${{ matrix.suite }})

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::testthat
          needs: check
          dependencies: '"hard"'

      - name: Install system libraries for optional backends 🧰
        if: matrix.suite == 'giotto'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libproj-dev libgdal-dev libgeos-dev libudunits2-dev

      - name: Install optional backend 📦
        uses: ./.github/actions/install-external-r-packages
        with:
          packages: ${{ matrix.packages }}
          required-packages: ${{ matrix.required }}
          library-name: scop-optional-${{ matrix.suite }}
          cache-version: scop-optional-${{ matrix.suite }}

      - name: Check out the PIDC implementation
        if: matrix.suite == 'grn-rna'
        uses: actions/checkout@v5
        with:
          repository: mengxu98/multiCSN_manuscript
          ref: 42ed2c50d11ba0255326fa32ce59b97c7bb4a8b8
          path: tmp/upstream-grn
          sparse-checkout: code/vendor/PIDC
          persist-credentials: false

      - name: Run optional backend tests 🧪
        shell: Rscript {0}
        env:
          SCOP_OPTIONAL_TEST_FILTER: ${{ matrix.filter }}
          SCOP_OPTIONAL_SUITE: ${{ matrix.suite }}
          SCOP_GRN_SOURCE_DIR: ${{ github.workspace }}/tmp/upstream-grn
        run: |
          results <- testthat::test_local(
            filter = Sys.getenv("SCOP_OPTIONAL_TEST_FILTER"),
            reporter = "summary",
            load_package = "source"
          )
          if (Sys.getenv("SCOP_OPTIONAL_SUITE") == "grn-rna") {
            results <- as.data.frame(results)
            stopifnot(nrow(results) > 0L, !any(results$skipped))
          }
