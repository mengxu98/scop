# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    # 02:00 Monday Asia/Shanghai, expressed in UTC for GitHub Actions.
    - cron: '0 18 * * 0'
  workflow_dispatch:

name: test-coverage

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package_changed: ${{ steps.filter.outputs.package_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "package_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `github.event.before` may be unreachable after a force-push.
          # In that case, run coverage rather than failing while filtering.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$head")"
          echo "$files"
          if printf '%s\n' "$files" |
            grep -Ev '^(scripts/.*|\.github/workflows/pkgdown\.yaml)$' |
            grep -q .; then
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_changed=false" >> "$GITHUB_OUTPUT"
          fi

  prepare-environment:
    needs: changes
    if: needs.changes.outputs.package_changed == 'true'
    uses: ./.github/workflows/warm-renv-cache.yaml

  test-coverage:
    needs: [changes, prepare-environment]
    if: needs.changes.outputs.package_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Restore locked R environment 🧰
        uses: ./.github/actions/prepare-renv

      - name: Install coverage tooling 📊
        uses: ./.github/actions/install-external-r-packages
        with:
          packages: |-
            covr@3.6.5
            rex@1.2.2
          required-packages: |-
            covr
            rex
          library-name: scop-ci-covr
          cache-version: scop-ci-covr

      - name: Test coverage 📊
        run: |
          covr_flags <- getOption("covr.flags")
          options(covr.flags = stats::setNames(rep("", length(covr_flags)), names(covr_flags)))
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
