# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Coverage is collected weekly: covr instrumentation slows the suite
# ~3.5x (1h+), while R-CMD-check already runs the full test suite on
# three platforms on every push. Run manually with workflow_dispatch
# whenever fresh coverage numbers are needed.
on:
  schedule:
    # 02:00 Monday Asia/Shanghai, expressed in UTC for GitHub Actions.
    - cron: '0 18 * * 0'
  workflow_dispatch:

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::covr, any::testthat
          needs: coverage

      - name: Test coverage 📊
        run: |
          # PRECAST's parallel Rcpp backend overflows the 8 MB default
          # runner stack (documented in its vignette); lift the limit.
          ulimit -s unlimited
          Rscript -e '
            covr_flags <- getOption("covr.flags")
            options(covr.flags = stats::setNames(rep("", length(covr_flags)), names(covr_flags)))
            covr::codecov(
              quiet = FALSE,
              clean = FALSE,
              install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
            )
          '
        shell: bash

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
