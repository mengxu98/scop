# Full site rebuild: reference + articles together, deployed with
# `clean: true` to purge stale pages. The incremental pkgdown and
# articles workflows never clean (each would delete the other's
# output), so this workflow is the single place that prunes the
# gh-pages branch.
on:
  workflow_dispatch:
  schedule:
    # 02:00 Monday Asia/Shanghai, expressed in UTC for GitHub Actions.
    - cron: '0 18 * * 0'

name: full-site

permissions:
  contents: write

jobs:
  full-site:
    runs-on: ubuntu-latest
    concurrency:
      group: full-site

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build full site
        shell: Rscript {0}
        run: pkgdown::build_site()

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: true
          branch: gh-pages
          folder: docs
