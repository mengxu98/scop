# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Articles are built and deployed by the separate articles workflow, so
# heavy vignette computations never block this reference build.
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  schedule:
    # 02:00 Monday Asia/Shanghai, expressed in UTC for GitHub Actions.
    - cron: '0 18 * * 0'
  workflow_dispatch:

name: pkgdown

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package_changed: ${{ steps.filter.outputs.package_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "package_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `github.event.before` may be unreachable after a force-push.
          # Fall back to the parent commit so a config-only push does not
          # trigger a full site build; the weekly schedule rebuilds
          # anything this comparison misses.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head~1"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "package_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          files="$(git diff --name-only "$base" "$head")"
          echo "$files"
          # Deploy only when rendered website inputs change. Source-only
          # changes are covered by R-CMD-check; their documentation is
          # regenerated when the corresponding man pages are committed.
          # Vignette changes are handled by the articles workflow.
          if printf '%s\n' "$files" |
            grep -E '^(README[.](md|Rmd|qmd)|NEWS\.md|DESCRIPTION|_pkgdown\.yml|man/|pkgdown/|inst/pkgdown/|[.]github/workflows/(pkgdown|warm-renv-cache|articles)\.yaml)' |
            grep -q .; then
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_changed=false" >> "$GITHUB_OUTPUT"
          fi

  pkgdown:
    needs: changes
    if: needs.changes.outputs.package_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Capture R library path 🔍
        id: r-info
        shell: bash
        run: |
          echo "r-version=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_OUTPUT"
          echo "r-lib=$(Rscript -e 'cat(.libPaths()[1])')" >> "$GITHUB_OUTPUT"

      # Same stable-key cache as test-coverage: OS + R version only, so
      # the full dependency library survives DESCRIPTION bumps.  The
      # weekly warm-renv-cache workflow keeps it alive.
      - name: Restore R package cache ♻️
        id: r-pkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          cache: false

      - name: Save R package cache 💾
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Determine pkgdown scope
        id: scope
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [[ "$base" =~ ^0+$ ]]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The previous SHA can be unreachable after a force-push. Fall
          # back to the parent commit so a config-only push does not
          # trigger a full build; the weekly schedule rebuilds anything
          # this comparison misses.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head~1"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "full_build=true" >> "$GITHUB_OUTPUT"
              echo "topics=" >> "$GITHUB_OUTPUT"
              echo "news_build=false" >> "$GITHUB_OUTPUT"
              echo "home_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git diff --name-status "$base" "$head" > changed-files.txt
          cat changed-files.txt

          awk '$2 !~ /^(scripts\/|tests\/|vignettes\/|[.]github\/workflows\/(test-coverage|articles)[.]ya?ml$)/ { print }' changed-files.txt > pkgdown-files.txt
          if [[ ! -s pkgdown-files.txt ]]; then
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if awk '$1 ~ /D/ { found = 1 } END { exit found ? 0 : 1 }' pkgdown-files.txt; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Global pkgdown configuration can affect every generated page.
          if awk '$2 == "_pkgdown.yml" { found = 1 } END { exit found ? 0 : 1 }' pkgdown-files.txt; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # README and DESCRIPTION changes only feed the home page
          # (index.html and its version footer); rebuild it in place
          # instead of triggering a full site build. Stale version
          # footers on other pages are refreshed by the weekly schedule.
          if awk '$2 ~ /^(README[.](md|Rmd|qmd)|DESCRIPTION)$/ { found = 1 } END { exit found ? 0 : 1 }' pkgdown-files.txt; then
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if awk '$2 !~ /^(R\/.*[.]R|man\/.*[.]Rd|NEWS[.]md|DESCRIPTION|_pkgdown[.]yml|[.]github\/workflows\/pkgdown[.]yaml)$/ { found = 1 } END { exit found ? 0 : 1 }' pkgdown-files.txt; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "topics=" >> "$GITHUB_OUTPUT"
            echo "news_build=false" >> "$GITHUB_OUTPUT"
            echo "home_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          topics="$(
            awk '$2 ~ /^man\/.*[.]Rd$/ { path = $2; sub(/^man\//, "", path); sub(/[.]Rd$/, "", path); print path }' pkgdown-files.txt |
            sort -u |
            paste -sd, -
          )"

          if awk '$2 == "NEWS.md" { found = 1 } END { exit found ? 0 : 1 }' pkgdown-files.txt; then
            news_build=true
          else
            news_build=false
          fi

          echo "full_build=false" >> "$GITHUB_OUTPUT"
          echo "topics=$topics" >> "$GITHUB_OUTPUT"
          echo "news_build=$news_build" >> "$GITHUB_OUTPUT"
          echo "home_build=false" >> "$GITHUB_OUTPUT"

      - name: Find missing published pages
        id: missing
        shell: Rscript {0}
        run: |
          config <- yaml::read_yaml("_pkgdown.yml")
          contents_or_empty <- function(section) {
            if (is.null(section$contents)) character() else section$contents
          }

          reference_topics <- unique(unlist(
            lapply(config$reference, contents_or_empty),
            use.names = FALSE
          ))
          reference_topics <- reference_topics[
            is.character(reference_topics) & nzchar(reference_topics)
          ]

          rd_files <- list.files("man", pattern = "[.]Rd$", full.names = TRUE)
          rd_aliases <- lapply(rd_files, function(path) {
            lines <- readLines(path, warn = FALSE)
            entries <- grep("^\\\\(name|alias)\\{", lines, value = TRUE)
            sub("^\\\\(name|alias)\\{([^}]*)\\}.*$", "\\2", entries)
          })
          alias_to_page <- unlist(Map(
            function(aliases, path) {
              stats::setNames(
                rep(tools::file_path_sans_ext(basename(path)), length(aliases)),
                aliases
              )
            },
            rd_aliases,
            rd_files
          ))
          missing_rd <- setdiff(reference_topics, names(alias_to_page))
          if (length(missing_rd) > 0L) {
            stop(
              "Configured reference topics have no Rd name or alias: ",
              paste(missing_rd, collapse = ", ")
            )
          }
          reference_pages <- unname(alias_to_page[reference_topics])

          expected_reference <- file.path("reference", paste0(reference_pages, ".html"))

          published <- tryCatch(
            system2(
              "git",
              c("ls-tree", "-r", "--name-only", "upstream/gh-pages"),
              stdout = TRUE,
              stderr = FALSE
            ),
            error = function(e) character()
          )
          if (length(published) == 0L) {
            published <- tryCatch(
              system2(
                "git",
                c("ls-tree", "-r", "--name-only", "origin/gh-pages"),
                stdout = TRUE,
                stderr = FALSE
              ),
              error = function(e) character()
            )
          }
          published <- gsub("\\\\", "/", published)

          missing_reference <- reference_topics[!expected_reference %in% published]

          output_file <- Sys.getenv("GITHUB_OUTPUT", unset = "")
          output <- paste0("reference_topics=", paste(missing_reference, collapse = ","))
          if (nzchar(output_file)) {
            write(output, file = output_file, append = TRUE)
          } else {
            writeLines(output)
          }
          message(
            "Missing published pkgdown reference pages: ", length(missing_reference)
          )

      - name: Build reference index
        if: github.event_name == 'pull_request' || steps.scope.outputs.full_build == 'false'
        run: |
          if (!requireNamespace("future", quietly = TRUE) ||
                !requireNamespace("future.apply", quietly = TRUE)) {
            install.packages(c("future", "future.apply"), quiet = TRUE)
          }
          future::plan("sequential", gc = TRUE)
          pkgdown::build_reference_index()
        shell: Rscript {0}

      - name: Build changed reference topics
        if: steps.scope.outputs.full_build != 'true' && (steps.scope.outputs.topics != '' || steps.missing.outputs.reference_topics != '')
        run: |
          if (!requireNamespace("future", quietly = TRUE) ||
                !requireNamespace("future.apply", quietly = TRUE)) {
            install.packages(c("future", "future.apply"), quiet = TRUE)
          }
          future::plan("sequential", gc = TRUE)
          split_topics <- function(x) {
            if (!nzchar(x)) character() else strsplit(x, ",", fixed = TRUE)[[1]]
          }
          topics <- unique(c(
            split_topics(Sys.getenv("PKGDOWN_TOPICS")),
            split_topics(Sys.getenv("PKGDOWN_MISSING_TOPICS"))
          ))
          pkgdown::build_reference(topics = topics, lazy = FALSE)
        shell: Rscript {0}
        env:
          PKGDOWN_TOPICS: ${{ steps.scope.outputs.topics }}
          PKGDOWN_MISSING_TOPICS: ${{ steps.missing.outputs.reference_topics }}

      - name: Build news
        if: github.event_name != 'pull_request' && steps.scope.outputs.full_build == 'false' && steps.scope.outputs.news_build == 'true'
        run: |
          pkgdown::build_news(preview = FALSE)
        shell: Rscript {0}

      - name: Build home
        if: steps.scope.outputs.home_build == 'true'
        run: |
          pkgdown::build_home()
        shell: Rscript {0}

      - name: Build site
        if: github.event_name != 'pull_request' && steps.scope.outputs.full_build == 'true'
        run: |
          if (!requireNamespace("future", quietly = TRUE) ||
                !requireNamespace("future.apply", quietly = TRUE)) {
            install.packages(c("future", "future.apply"), quiet = TRUE)
          }
          future::plan("sequential", gc = TRUE)
          # Articles are always built by the articles workflow (changed
          # vignettes on push, everything on workflow_dispatch); the
          # full build here covers home, reference, news, and search so
          # heavy article computations never block this job.
          pkgdown::build_home()
          pkgdown::build_reference_index()
          pkgdown::build_reference()
          pkgdown::build_news(preview = FALSE)
          pkgdown::build_search()
        shell: Rscript {0}

      - name: Audit configured pkgdown pages
        shell: Rscript {0}
        env:
          PKGDOWN_FULL_BUILD: ${{ steps.scope.outputs.full_build }}
        run: |
          config <- yaml::read_yaml("_pkgdown.yml")
          contents_or_empty <- function(section) {
            if (is.null(section$contents)) character() else section$contents
          }

          reference_topics <- unique(unlist(
            lapply(config$reference, contents_or_empty),
            use.names = FALSE
          ))
          reference_topics <- reference_topics[
            is.character(reference_topics) & nzchar(reference_topics)
          ]
          rd_files <- list.files("man", pattern = "[.]Rd$", full.names = TRUE)
          rd_aliases <- lapply(rd_files, function(path) {
            lines <- readLines(path, warn = FALSE)
            entries <- grep("^\\\\(name|alias)\\{", lines, value = TRUE)
            sub("^\\\\(name|alias)\\{([^}]*)\\}.*$", "\\2", entries)
          })
          alias_to_page <- unlist(Map(
            function(aliases, path) {
              stats::setNames(
                rep(tools::file_path_sans_ext(basename(path)), length(aliases)),
                aliases
              )
            },
            rd_aliases,
            rd_files
          ))
          reference_pages <- unname(alias_to_page[reference_topics])

          expected_reference <- file.path("reference", paste0(reference_pages, ".html"))

          published <- tryCatch(
            system2(
              "git",
              c("ls-tree", "-r", "--name-only", "upstream/gh-pages"),
              stdout = TRUE,
              stderr = FALSE
            ),
            error = function(e) character()
          )
          if (length(published) == 0L) {
            published <- tryCatch(
              system2(
                "git",
                c("ls-tree", "-r", "--name-only", "origin/gh-pages"),
                stdout = TRUE,
                stderr = FALSE
              ),
              error = function(e) character()
            )
          }
          published <- gsub("\\\\", "/", published)

          local <- if (dir.exists("docs")) {
            list.files("docs", recursive = TRUE, all.files = TRUE, no.. = TRUE)
          } else {
            character()
          }
          local <- gsub("\\\\", "/", local)
          full_build <- identical(Sys.getenv("PKGDOWN_FULL_BUILD"), "true")
          available <- if (full_build) local else unique(c(published, local))
          missing <- expected_reference[!expected_reference %in% available]
          if (length(missing) > 0L) {
            stop(
              "Configured pkgdown reference pages are absent from gh-pages and this build:\n- ",
              paste(missing, collapse = "\n- "),
              call. = FALSE
            )
          }
          message(
            "Pkgdown page audit passed against ",
            if (full_build) "this full build" else "published and local output",
            ": ", length(expected_reference), " reference pages"
          )

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: ${{ steps.scope.outputs.full_build == 'true' }}
          branch: gh-pages
          folder: docs
