name: pkgdown

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every page and execute all runnable examples
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      execute: ${{ steps.plan.outputs.execute }}
      topics: ${{ steps.plan.outputs.topics }}
      articles: ${{ steps.plan.outputs.articles }}
    steps:
      - uses: actions/checkout@v5

      - name: Plan website changes
        id: plan
        env:
          PKGDOWN_EVENT: ${{ github.event_name }}
          PKGDOWN_BASE: ${{ github.event.pull_request.base.sha }}
          PKGDOWN_FORCE: ${{ inputs.full || false }}
        run: python3 .github/pkgdown-plan.py

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-plan
          path: pkgdown-plan.json

  pkgdown:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PKGDOWN_TOPICS: ${{ needs.plan.outputs.topics }}
      PKGDOWN_ARTICLES: ${{ needs.plan.outputs.articles }}
      PKGDOWN_EXECUTE: ${{ needs.plan.outputs.execute }}
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-plan

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - name: Determine example and article dependencies
        id: dependencies
        run: Rscript --vanilla .github/pkgdown-build.R dependencies

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: ${{ steps.dependencies.outputs.packages }}
          extra-packages: |
            ${{ steps.dependencies.outputs.extra }}
            any::testthat
          needs: website
          dependencies: '"hard"'
          cache: always

      - name: Invalidate output from a different R environment
        id: environment
        run: Rscript --vanilla .github/pkgdown-build.R environment

      - name: Determine full rebuild dependencies
        id: full-dependencies
        if: steps.environment.outputs.changed == 'true'
        run: Rscript --vanilla .github/pkgdown-build.R dependencies

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.environment.outputs.changed == 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: ${{ steps.full-dependencies.outputs.packages }}
          extra-packages: |
            ${{ steps.full-dependencies.outputs.extra }}
            any::testthat
          needs: website
          dependencies: '"hard"'
          cache: always

      - name: Restore unchanged website pages
        run: python3 .github/pkgdown-plan.py restore

      - uses: actions/setup-python@v6
        id: macs2-python
        if: env.PKGDOWN_EXECUTE == 'true'
        with:
          python-version: '3.11'
          update-environment: false

      - name: Prepare official MACS2 for synthetic acceptance
        if: env.PKGDOWN_EXECUTE == 'true'
        run: |
          mkdir -p atac-acceptance
          "${{ steps.macs2-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/scop-macs2"
          "$RUNNER_TEMP/scop-macs2/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple \
            'setuptools>=41.2' wheel 'numpy==1.26.4' 'Cython==0.29.37'
          printf '%s\n' 'MACS2==2.2.9.1 --hash=sha256:8d56bc37fb823fc6387d78138ce968405c54a0a8cd9776682705fd0983252d16' \
            > "$RUNNER_TEMP/scop-macs2-requirements.txt"
          "$RUNNER_TEMP/scop-macs2/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple \
            --no-build-isolation --no-deps --require-hashes -r "$RUNNER_TEMP/scop-macs2-requirements.txt"
          "$RUNNER_TEMP/scop-macs2/bin/python" -m pip check
          "$RUNNER_TEMP/scop-macs2/bin/python" --version > atac-acceptance/python-version.txt
          "$RUNNER_TEMP/scop-macs2/bin/python" -m pip freeze > atac-acceptance/python-packages.txt
          "$RUNNER_TEMP/scop-macs2/bin/macs2" --version > atac-acceptance/macs2-version.txt
          sha256sum "$RUNNER_TEMP/scop-macs2/bin/macs2" > atac-acceptance/macs2-launcher.sha256

      - name: Verify combined ATAC and WNN contracts
        if: env.PKGDOWN_EXECUTE == 'true'
        run: Rscript --vanilla .github/atac-combined-acceptance.R . atac-acceptance

      - name: Verify real MACS2 calls with synthetic fragments
        if: env.PKGDOWN_EXECUTE == 'true'
        run: Rscript --vanilla .github/atac-macs2-acceptance.R "$RUNNER_TEMP/scop-macs2/bin/macs2" atac-acceptance/macs2

      - name: Verify pak survives processx and parallel shutdown
        if: env.PKGDOWN_EXECUTE == 'true'
        run: Rscript --vanilla .github/pkgdown-pak-exit.R

      - name: Build and verify website
        run: |
          Rscript --vanilla -e '
            tryCatch(
              source(".github/pkgdown-build.R", echo = FALSE),
              finally = {
                tryCatch(
                  capture.output({
                    cat("Loaded namespaces\n")
                    print(sort(loadedNamespaces()))
                    cat("\nLoaded DLLs\n")
                    print(getLoadedDLLs())
                    cat("\nSession information\n")
                    print(sessionInfo())
                    cat("\nProcess mappings\n")
                    if (file.exists("/proc/self/maps")) {
                      writeLines(readLines("/proc/self/maps", warn = FALSE))
                    }
                  }, file = "pkgdown-exit-state.txt"),
                  error = function(e) {
                    message("Could not save pkgdown exit diagnostics: ", conditionMessage(e))
                  }
                )
              }
            )
          ' build

      - uses: actions/upload-artifact@v4
        if: always() && env.PKGDOWN_EXECUTE == 'true'
        with:
          name: atac-combined-acceptance
          include-hidden-files: true
          path: |
            atac-acceptance/
            pkgdown-session.txt
            docs/.pkgdown-build.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pkgdown-diagnostics
          path: |
            pkgdown-plan.json
            pkgdown-timings.csv
            pkgdown-session.txt
            pkgdown-exit-state.txt
            docs/**/*.html

      - name: Deploy website
        if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: docs
          clean: true
