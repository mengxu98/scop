name: pkgdown

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every page and execute all runnable examples
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      execute: ${{ steps.plan.outputs.execute }}
      topics: ${{ steps.plan.outputs.topics }}
      articles: ${{ steps.plan.outputs.articles }}
    steps:
      - uses: actions/checkout@v5

      - name: Plan website changes
        id: plan
        env:
          PKGDOWN_EVENT: ${{ github.event_name }}
          PKGDOWN_FORCE: ${{ inputs.full || false }}
        run: python3 .github/pkgdown-plan.py

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-plan
          path: pkgdown-plan.json

  pkgdown:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PKGDOWN_TOPICS: ${{ needs.plan.outputs.topics }}
      PKGDOWN_ARTICLES: ${{ needs.plan.outputs.articles }}
      PKGDOWN_EXECUTE: ${{ needs.plan.outputs.execute }}
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ubuntu-apt-mirrors

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-plan

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: deps::.
          extra-packages: any::pkgdown, any::callr, any::jsonlite, any::sessioninfo, any::xml2, any::renv
          needs: website
          dependencies: ${{ needs.plan.outputs.execute == 'true' && '"hard"' || 'character()' }}
          cache: always

      - name: Invalidate output from a different R environment
        id: environment
        run: Rscript --vanilla .github/pkgdown-build.R environment

      - name: Expand changed environments to a full build
        if: steps.environment.outputs.changed == 'true'
        run: python3 .github/pkgdown-plan.py full

      - name: Discover documentation dependencies
        id: dependencies
        if: needs.plan.outputs.execute == 'true' || steps.environment.outputs.changed == 'true'
        run: |
          Rscript --vanilla .github/pkgdown-build.R dependencies
          echo "MAMBA_ROOT_PREFIX=$RUNNER_TEMP/pkgdown-python" >> "$GITHUB_ENV"
          echo "cpu=$(LC_ALL=C lscpu | sed -n '/Model name:/p; /Flags:/p' | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: needs.plan.outputs.execute == 'true' || steps.environment.outputs.changed == 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: deps::.,local::.
          lockfile-create-lib: .libPaths()
          extra-packages: ${{ steps.dependencies.outputs.extra }}
          needs: website
          dependencies: '"hard"'
          cache: always

      - uses: actions/cache/restore@v4
        id: python-cache
        if: steps.dependencies.outputs.python == 'true'
        with:
          path: ${{ runner.temp }}/pkgdown-python/envs
          key: pkgdown-python-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependencies.outputs.cpu }}-${{ hashFiles('R/PrepareEnv.R', 'R/check_packages.R', 'R/python_utils.R') }}-${{ steps.dependencies.outputs.python_key }}

      - name: Prepare Python environments
        if: steps.dependencies.outputs.python == 'true'
        run: Rscript --vanilla .github/pkgdown-build.R python

      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.python == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/pkgdown-python/envs
          key: ${{ steps.python-cache.outputs.cache-primary-key }}

      - name: Restore unchanged website pages
        run: python3 .github/pkgdown-plan.py restore

      - name: Build and verify website
        run: Rscript --vanilla .github/pkgdown-build.R build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pkgdown-diagnostics
          path: |
            pkgdown-plan.json
            pkgdown-timings.csv
            pkgdown-session.txt
            docs/**/*.html

      - name: Deploy website
        if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: docs
          clean: true
