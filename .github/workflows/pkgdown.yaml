name: pkgdown

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every page and execute all runnable examples
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      execute: ${{ steps.plan.outputs.execute }}
      topics: ${{ steps.plan.outputs.topics }}
      articles: ${{ steps.plan.outputs.articles }}
    steps:
      - uses: actions/checkout@v5

      - name: Check incremental build selection
        run: python3 .github/test-pkgdown-plan.py

      - name: Plan website changes
        id: plan
        env:
          PKGDOWN_EVENT: ${{ github.event_name }}
          PKGDOWN_BASE: ${{ github.event.pull_request.base.sha }}
          PKGDOWN_FORCE: ${{ inputs.full || false }}
        run: python3 .github/pkgdown-plan.py

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-plan
          path: pkgdown-plan.json

  pkgdown:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PKGDOWN_TOPICS: ${{ needs.plan.outputs.topics }}
      PKGDOWN_ARTICLES: ${{ needs.plan.outputs.articles }}
      PKGDOWN_EXECUTE: ${{ needs.plan.outputs.execute }}
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-plan

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - name: Determine example and article dependencies
        id: dependencies
        run: |
          Rscript --vanilla .github/test-pkgdown-dependencies.R
          Rscript --vanilla .github/pkgdown-dependencies.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: ${{ steps.dependencies.outputs.packages }}
          extra-packages: ${{ steps.dependencies.outputs.extra }}
          needs: website
          dependencies: '"hard"'
          cache: always

      - name: Invalidate output from a different R environment
        id: environment
        run: |
          Rscript --vanilla .github/test-pkgdown-environment.R
          Rscript --vanilla .github/pkgdown-environment.R

      - name: Determine full rebuild dependencies
        id: full-dependencies
        if: steps.environment.outputs.changed == 'true'
        run: Rscript --vanilla .github/pkgdown-dependencies.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.environment.outputs.changed == 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          packages: ${{ steps.full-dependencies.outputs.packages }}
          extra-packages: ${{ steps.full-dependencies.outputs.extra }}
          needs: website
          dependencies: '"hard"'
          cache: always

      - name: Verify enrichment backend compatibility
        if: contains(env.PKGDOWN_TOPICS, 'RunGSEA') || contains(env.PKGDOWN_ARTICLES, 'differential-enrichment-workflow')
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("clusterProfiler", quietly = TRUE))
          library(scop)
          testthat::test_file(
            "tests/testthat/test-gsea-enrichment-empty-version.R",
            reporter = "summary", stop_on_failure = TRUE
          )

      - name: Restore unchanged website pages
        run: python3 .github/pkgdown-plan.py restore

      - name: Build and verify website
        run: |
          Rscript --vanilla .github/test-pkgdown-output.R
          Rscript --vanilla .github/pkgdown-build.R

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pkgdown-diagnostics
          path: |
            pkgdown-plan.json
            pkgdown-timings.csv
            pkgdown-session.txt
            docs/**/*.html

      - name: Deploy website
        if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: docs
          clean: true
