name: warm-renv-cache

on:
  schedule:
    # 02:00 Monday Asia/Shanghai, expressed in UTC for GitHub Actions.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Keeps the r-full-v1 dependency library cache warm.  GitHub evicts
# cache entries that have not been accessed in 7 days; without this
# job, a quiet week would cold-start test-coverage (~1-2 hr
# recompilation of bioinformatics Suggests).  test-coverage and
# pkgdown restore this cache and install only the delta against
# DESCRIPTION.

jobs:
  warm-cache:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Capture R library path 🔍
        id: r-info
        shell: bash
        run: |
          echo "r-version=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_OUTPUT"
          echo "r-lib=$(Rscript -e 'cat(.libPaths()[1])')" >> "$GITHUB_OUTPUT"

      - name: Restore R package cache ♻️
        id: r-pkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::covr, any::testthat
          needs: coverage
          cache: false

      - name: Save R package cache 💾
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-full-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}
