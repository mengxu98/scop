# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'renv', check-args: 'c("--no-manual", "--as-cran", "--no-examples", "--no-tests")'}
          - {os: windows-latest, r: 'renv', check-args: 'c("--no-manual", "--as-cran", "--no-examples", "--no-tests")'}
          - {os: ubuntu-latest, r: 'renv', check-args: 'c("--no-manual", "--as-cran", "--no-examples", "--no-tests")'}

    concurrency:
      group: scop-full-${{ github.sha }}-${{ matrix.config.os }}
      cancel-in-progress: false
      queue: max

    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Prepare locked R environment 🧰
        uses: ./.github/actions/prepare-renv

      - name: Install R CMD check tooling 🔧
        uses: ./.github/actions/install-external-r-packages
        with:
          packages: |-
            rcmdcheck@1.4.0
            xopen@1.0.1
          required-packages: |-
            rcmdcheck
            xopen
          library-name: scop-ci-rcmdcheck
          cache-version: scop-ci-rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check-args }}
          build_args: '"--no-manual"'
          error-on: '"error"'
          upload-snapshots: true
