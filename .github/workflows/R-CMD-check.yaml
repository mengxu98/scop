# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release', check-args: 'c("--no-manual", "--as-cran", "--no-examples")'}
          - {os: windows-latest, r: 'release', check-args: 'c("--no-manual", "--as-cran", "--no-examples")'}
          - {os: ubuntu-latest, r: 'release', check-args: 'c("--no-manual", "--as-cran", "--no-examples")'}

    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # Windows compiles 40+ C++ translation units; allow 20 minutes so
      # install never fails on a slow runner.
      _R_CHECK_INSTALL_ELAPSED_TIMEOUT_: 1200

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Capture R library path 🔍
        id: r-info
        shell: bash
        run: |
          echo "r-version=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_OUTPUT"
          echo "r-lib=$(Rscript -e 'cat(.libPaths()[1])')" >> "$GITHUB_OUTPUT"

      # The cache key is decoupled from the dependency manifest: it pins
      # OS + R version only, so DESCRIPTION bumps never force a full
      # recompilation (Ubuntu used to rebuild ~80 bioinformatics packages
      # from source, ~60 min).  setup-r-dependencies installs just the
      # delta between the restored library and DESCRIPTION.
      - name: Restore R package cache ♻️
        id: r-pkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-hard-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r-hard-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::rcmdcheck, any::testthat, github::immunogenomics/presto
          needs: check
          dependencies: '"hard"'
          cache: false

      # Presto is deliberately runtime-optional and therefore is not exposed
      # as a declared dependency inside R CMD check. Exercise the real GitHub
      # installation here, before the check process narrows its library view.
      - name: Verify runtime Presto backend 🧪
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE, compile = FALSE)
          presto_fun <- get("presto_get_fun", asNamespace("scop"))(
            install = FALSE,
            error_on_missing = FALSE
          )
          stopifnot(is.function(presto_fun))
          testthat::test_file(
            "tests/testthat/test-presto-backend.R",
            reporter = "summary",
            stop_on_failure = TRUE
          )
          source_parity_tests <- list(
            "tests/testthat/test-rundetest-findmarkers.R" = c(
              "RunDEtest uses scop FindMarkers-compatible sparse Wilcoxon path",
              "FindMarkers native branches exactly match the Seurat method",
              "supported RunDEtest Wilcoxon branches stay on the scop backend",
              "RunDEtest all-in-one markers match the pairwise scop backend"
            ),
            "tests/testthat/test-seurat-fast-paths.R" = c(
              "FindAllMarkers supports feature subsets with Seurat parity",
              "FindAllMarkers native path covers metadata groups and FC controls",
              "FindAllMarkers accelerates Seurat-compatible sampling"
            )
          )
          for (test_path in names(source_parity_tests)) {
            for (test_description in source_parity_tests[[test_path]]) {
              testthat::test_file(
                test_path,
                desc = test_description,
                reporter = "summary",
                stop_on_failure = TRUE
              )
            }
          }

      - name: Save R package cache 💾
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.r-info.outputs.r-lib }}
          key: r-hard-v1-${{ runner.os }}-r${{ steps.r-info.outputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check-args }}
          build_args: '"--no-manual"'
          error-on: '"error"'
          upload-snapshots: true
