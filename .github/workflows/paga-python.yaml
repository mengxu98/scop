name: PAGA Python integration
on:
  pull_request:
    paths:
      - 'inst/python/functions.py'
      - 'R/PrepareEnv.R'
      - 'tests/python/test_paga_neighbors.py'
      - '.github/workflows/paga-python.yaml'
  workflow_dispatch:
jobs:
  paga:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install legacy Scanpy compatibility profile
        run: python -m pip install 'scanpy==1.11.3' 'scipy==1.15.3' 'pynndescent==0.6.0' 'igraph==0.11.9' 'numpy==1.26.4' 'pandas==2.2.0' 'anndata==0.11.4' 'zarr<3' 'numba==0.66.0' 'llvmlite==0.48.0' 'scikit-learn==1.7.0' 'matplotlib==3.10.8'
      - run: python -m pip check
      - run: python -m unittest discover -s tests/python -v
