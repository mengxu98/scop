name: Prepare locked R environment
description: Restore the scop R environment from renv.lock and reuse its cache.

inputs:
  cache-version:
    description: Cache namespace used to invalidate the shared renv cache.
    required: false
    default: scop-full

runs:
  using: composite
  steps:
    - name: Set up R from renv.lock 🧰
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: renv
        use-public-rspm: true

    - name: Install Ubuntu system requirements 🧱
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake \
          default-jdk \
          gdal-bin \
          git \
          gsfonts \
          libabsl-dev \
          libbz2-dev \
          libcairo2-dev \
          libcurl4-openssl-dev \
          libfftw3-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libfribidi-dev \
          libgdal-dev \
          libgeos-dev \
          libglpk-dev \
          libharfbuzz-dev \
          libhdf5-dev \
          libhwloc-dev \
          libicu-dev \
          libjpeg-dev \
          liblzma-dev \
          libmagick++-dev \
          libnode-dev \
          libpng-dev \
          libproj-dev \
          libsqlite3-dev \
          libssl-dev \
          libtiff-dev \
          libudunits2-dev \
          libuv1-dev \
          libwebp-dev \
          libxml2-dev \
          make \
          pandoc \
          patch \
          perl \
          python3 \
          zlib1g-dev
        sudo R CMD javareconf

    - name: Restore locked R environment ♻️
      uses: r-lib/actions/setup-renv@v2
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        cache-version: ${{ inputs.cache-version }}-${{ runner.arch }}

    - name: Verify locked R package versions 🔎
      shell: Rscript {0}
      run: |
        records <- renv::lockfile_read("renv.lock")$Packages
        installed <- installed.packages()
        project_installed <- installed.packages(lib.loc = renv::paths$library())
        missing <- setdiff(names(records), rownames(installed))
        candidates <- intersect(names(records), rownames(installed))
        mismatched <- candidates[vapply(
          candidates,
          function(package) {
            !identical(
              as.character(installed[package, "Version"]),
              as.character(records[[package]]$Version)
            )
          },
          logical(1)
        )]
        unexpected <- setdiff(rownames(project_installed), names(records))
        if (length(missing) || length(mismatched) || length(unexpected)) {
          stop(
            "The restored library does not match renv.lock. Missing: ",
            paste(missing, collapse = ", "),
            "; mismatched: ",
            paste(mismatched, collapse = ", "),
            "; unexpected in project library: ",
            paste(unexpected, collapse = ", ")
          )
        }
